name: Publish NuGet Package

on:
  release:
    types: [ published ]

env:
  CONFIGURATION: Release
  COVERAGE_DIR: ./coverage
  PACKAGE_OUTPUT_PATH: ./artifacts/package
  SOLUTION_PATH: Ashlar.slnx

jobs:
  publish:
    name: Publish to NuGet.org
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          ref: refs/tags/${{ github.event.release.tag_name }}
      - name: Setup .NET
        uses: actions/setup-dotnet@v6.0.0
        with:
          cache: true
          cache-dependency-path: |
            Ashlar.slnx
            global.json
            .config/dotnet-tools.json
            **/Directory.Build.props
            **/Directory.Packages.props
            **/*.csproj
      - name: Restore Tools
        run: dotnet tool restore
      - name: Restore Dependencies
        run: dotnet restore "$SOLUTION_PATH"
      - name: Build
        run: dotnet build "$SOLUTION_PATH" --configuration "$CONFIGURATION" --no-restore
      - name: Test
        run: dotnet test "$SOLUTION_PATH" --configuration "$CONFIGURATION" --no-build --no-restore --coverlet --results-directory "$COVERAGE_DIR"
      - name: Check Coverage
        run: dotnet coveragechecker --format Cobertura --glob-patterns "${COVERAGE_DIR}/**/coverage.cobertura.*.xml" --line-threshold 100 --branch-threshold 100
      - name: Pack production packages
        run: dotnet pack "$SOLUTION_PATH" --configuration "$CONFIGURATION" --no-restore --output "$PACKAGE_OUTPUT_PATH" -p:AshlarOfficialBuild=true
      - name: Package Consumption Smoke Test
        shell: pwsh
        run: ./eng/package-consumption-smoke.ps1 -Configuration $env:CONFIGURATION -PackageOutputPath $env:PACKAGE_OUTPUT_PATH -SkipPack
      - name: Authenticate with NuGet
        uses: nuget/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
        id: nuget-auth
        with:
          user: ${{ secrets.NUGET_USERNAME }}
      - name: Push to NuGet.org
        run: dotnet nuget push "${PACKAGE_OUTPUT_PATH}/*.nupkg" --api-key ${{ steps.nuget-auth.outputs.nuget_api_key }} --source https://api.nuget.org/v3/index.json --skip-duplicate
